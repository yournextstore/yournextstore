# New stores are seeded from a theme-* branch and get the newest commerce-kit on their first
# workspace setup (yns-app, builder-drive-sandbox.ts). A theme that stops building against it
# breaks every store made from it, so check each one the same way, every night.
name: Theme build check

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      themes:
        description: "Space-separated theme branches to check (empty: all of them)"
        required: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      themes: ${{ steps.list.outputs.themes }}
    steps:
      - id: list
        env:
          THEMES: ${{ inputs.themes }}
          REPO: ${{ github.repository }}
        run: |
          names="$THEMES"
          if [ -z "$names" ]; then
            names=$(git ls-remote --heads "https://github.com/$REPO" 'theme-*' | sed 's#.*refs/heads/##')
          fi
          echo "themes=$(printf '%s\n' $names | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        theme: ${{ fromJson(needs.list.outputs.themes) }}
    env:
      # Read-only key of a demo store; without it the prerender step is skipped.
      YNS_API_KEY: ${{ secrets.THEME_CHECK_YNS_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.theme }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - name: Upgrade commerce-kit like a new store's workspace does
        run: bun add commerce-kit@latest
      - run: bunx next typegen
      - run: bunx tsc --noEmit
      # Type checks miss prerender errors such as searchParams read inside "use cache".
      - name: Production build
        if: env.YNS_API_KEY != ''
        run: bunx next build
